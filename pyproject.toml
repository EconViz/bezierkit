[project]
name = "bezierkit"
version = "1.0.1"
description = "A small mathematical toolkit for constructing and analyzing Bezier curves."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "EconViz" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/EconViz/bezierkit"
Repository = "https://github.com/EconViz/bezierkit"
Issues = "https://github.com/EconViz/bezierkit/issues"
Changelog = "https://github.com/EconViz/bezierkit/blob/main/CHANGELOG.md"

[project.scripts]
bezierkit = "bezierkit.cli.app:main"

[project.optional-dependencies]
cli = [
    "rich>=13",
    "typer>=0.12",
]
matplotlib = [
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bezierkit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.importlinter]
root_package = "bezierkit"

[[tool.importlinter.contracts]]
name = "core has no internal dependencies"
type = "forbidden"
source_modules = ["bezierkit.core"]
forbidden_modules = [
  "bezierkit.bezier",
  "bezierkit.construction",
  "bezierkit.sampling",
  "bezierkit.cli",
]

[[tool.importlinter.contracts]]
name = "sampling only depends on core"
type = "forbidden"
source_modules = ["bezierkit.sampling"]
forbidden_modules = ["bezierkit.bezier", "bezierkit.construction", "bezierkit.cli"]

[[tool.importlinter.contracts]]
name = "operations do not depend on evaluation"
type = "forbidden"
source_modules = ["bezierkit.bezier.operations"]
forbidden_modules = ["bezierkit.bezier.evaluation"]

[[tool.importlinter.contracts]]
name = "application layers"
type = "layers"
layers = [
  "bezierkit.cli",
  "bezierkit.adapters",
  "bezierkit.export",
  "bezierkit.implicit",
  "bezierkit.fitting",
  "bezierkit.interpolation",
  "bezierkit.construction",
  "bezierkit.bezier",
  "bezierkit.core",
]

[dependency-groups]
dev = [
    "import-linter>=2",
    "pre-commit>=4.6.2",
    "pytest>=8",
    "ruff>=0.6",
]
